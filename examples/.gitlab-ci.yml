stages:
  - build
  - test

variables:
  APP_NAME: "polyci-demo"

build:
  stage: build
  image: alpine:3.19
  script:
    - echo "Building $APP_NAME"
    - mkdir -p /workspace/dist
    - echo "binary" > /workspace/dist/app

test:
  stage: test
  image: alpine:3.19
  before_script:
    - echo "Preparing test environment"
  script:
    - echo "Running tests for $APP_NAME"
    - test -f /workspace/dist/app && echo "artifact missing check skipped (fresh container)" || echo "no shared volume between jobs (expected)"
  after_script:
    - echo "Cleaning up"
