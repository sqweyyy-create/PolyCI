version: 2

project_name: polyci

before:
  hooks:
    - go mod tidy

builds:
  - id: polyci
    main: ./cmd/polyci
    binary: polyci
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - id: polyci
    ids:
      - polyci
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^test:"
      - "^chore:"

# PolyCI is a plain CLI binary, not a GUI/macOS app, so a Homebrew Formula
# (installed with a plain `brew install`, no --cask) is the right convention
# here — even though goreleaser's own docs now steer toward homebrew_casks
# for precompiled binaries in general, `brews` is what makes `brew install
# polyci` work without --cask.
brews:
  - name: polyci
    repository:
      owner: sqweyyy-create
      name: homebrew-polyci
    directory: Formula
    homepage: "https://github.com/sqweyyy-create/PolyCI"
    description: "Run CI/CD pipelines locally in Docker containers, with a debugger, across GitLab CI, CircleCI, and GitHub Actions"
    license: "MIT"
    install: |
      bin.install "polyci"
    test: |
      system "#{bin}/polyci", "-h"
