version: 2.1

jobs:
  build:
    docker:
      - image: alpine:3.19
    environment:
      APP_NAME: hello-world
    steps:
      - checkout
      - run: echo "Building $APP_NAME..."
      - run:
          name: Report Node version placeholder
          command: echo "using node $NODE_ENV"
          environment:
            NODE_ENV: production

  test:
    docker:
      - image: alpine:3.19
    steps:
      - run: echo "Running unit tests..."

  lint:
    docker:
      - image: alpine:3.19
    steps:
      - run: echo "Linting..."

workflows:
  build-test-lint:
    jobs:
      - build
      - test:
          requires:
            - build
      - lint:
          requires:
            - build
