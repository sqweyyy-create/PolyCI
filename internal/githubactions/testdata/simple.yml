name: CI

on: [push]

env:
  GLOBAL_VAR: hello

jobs:
  build:
    runs-on: ubuntu-latest
    container: alpine:3.19
    env:
      JOB_VAR: world
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: echo building
      - name: Run with custom env
        run: echo "$GREETING"
        env:
          GREETING: hi-from-step

  test:
    runs-on: ubuntu-latest
    needs: build
    container: alpine:3.19
    steps:
      - run: echo testing
